; CircuitMess Chatter green PCB / V2.1
[env:chatter2-v21]
extends = esp32_base
board_level = release
board = esp32doit-devkit-v1

extra_scripts =
  ${esp32_base.extra_scripts}
  pre:variants/esp32/chatter2-v21/apply_patches.py

build_unflags =
  -flto
  -std=gnu++11

build_flags =
  ${esp32_base.build_flags}
  -std=gnu++17
  -D CHATTER_2
  -I variants/esp32/chatter2-v21
  -DMESHTASTIC_EXCLUDE_WEBSERVER=1
  -DMESHTASTIC_EXCLUDE_PAXCOUNTER=1

lib_deps =
  ${esp32_base.lib_deps}
  lovyan03/LovyanGFX@1.2.27
